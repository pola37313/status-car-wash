backend:
  name: git-gateway
  branch: main # or master

media_folder: "status-car-wash/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Блог та Новини"
    folder: "status-car-wash/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Дата", name: "date", widget: "date", format: "YYYY-MM-DD"}
      - {label: "Головне зображення", name: "image", widget: "image"}
      - {label: "Текст статті", name: "body", widget: "markdown"}
