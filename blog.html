    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>CAR WASH</span>
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center gap-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="locations.html">Локації</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Ціни та Послуги</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про нас & Детейлінг</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Блог</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="hero" style="padding: 140px 0 60px;">
        <div class="container text-center">
            <h1>БЛОГ ТА <span>СТАТТІ</span></h1>
            <p class="mx-auto">Корисні поради від професіоналів автомийок та детейлінгу для догляду за вашим авто.</p>
        </div>
    </header>

    <!-- Blog List Section -->
    <section class="section-padding pt-4">
        <div class="container">
            <div class="row g-4" id="blog-container">
                <div class="col-12 text-center text-muted">Завантаження статей з Google Таблиці...</div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash. Всі права захищені.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Google Sheets CSV Export URL
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1wg4tp4uShhYWfO8SEjeHlH32z0hAh5cgK3fW8bUg9EM/export?format=csv';

        // Simple CSV Parser handling quoted fields with commas/newlines
        function parseCSV(text) {
            let lines = [];
            let row = [''];
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i+1];
                
                if (c === '"' && inQuotes && nextC === '"') {
                    row[row.length - 1] += '"';
                    i++;
                } else if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' && nextC === '\n') || (c === '\n' && !inQuotes)) {
                    if (c === '\r') i++;
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        }

        async function loadGoogleSheetBlog() {
            const container = document.getElementById('blog-container');
            try {
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                
                const rows = parseCSV(csvText);
                
                // Skip header (row 0), process data starting from row 1
                const posts = rows.slice(1).filter(r => r.length >= 4 && r[1] && r[1].trim() !== '');

                if (posts.length === 0) {
                    container.innerHTML = '<div class="col-12 text-center text-muted">Поки що немає опублікованих статей у таблиці.</div>';
                    return;
                }

                container.innerHTML = '';
                
                // Reverse to show newest (bottom rows) first, or keep standard order
                posts.forEach((post, index) => {
                    const date = post[0] || '';
                    const title = post[1] || '';
                    const image = post[2] || '';
                    const content = post[3] || '';
                    const snippet = content.replace(/[#*`_]/g, '').substring(0, 90);

                    const col = document.createElement('div');
                    col.className = 'col-md-4';
                    col.innerHTML = `
                        <div class="feature-card h-100 d-flex flex-column justify-content-between border-secondary">
                            <div>
                                ${image ? `<img src="${image}" alt="${title}" class="img-fluid rounded mb-3" style="height: 180px; width: 100%; object-fit: cover;">` : ''}
                                <span class="badge bg-primary mb-2">Блог</span>
                                <h3>${title}</h3>
                                <p class="text-muted small mb-2"><i class="fa-solid fa-calendar-days me-1"></i> ${date}</p>
                                <p class="small text-muted mb-4">${snippet}...</p>
                            </div>
                            <a href="article.html?id=${index}" class="btn btn-outline-custom w-100 btn-sm">Читати статтю</a>
                        </div>
                    `;
                    container.appendChild(col);
                });

                // Save posts to sessionStorage so article.html can read them
                sessionStorage.setItem('status_sheet_posts', JSON.stringify(posts));

            } catch (err) {
                console.error('Error loading Google Sheet CSV:', err);
                container.innerHTML = '<div class="col-12 text-center text-danger">Не вдалося завантажити статті з Google Таблиці.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadGoogleSheetBlog);
    </script>
</body>
</html>
