<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог та Новини — STATUS Car Wash</title>
    <meta name="description" content="Корисні поради по догляду за автомобілем, новини мережі автомийок самообслуговування STATUS та рекомендації від експертів детейлінгу.">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>CAR WASH</span>
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center gap-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="locations.html">Локації</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Ціни та Послуги</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про нас & Детейлінг</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Блог</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="hero" style="padding: 140px 0 60px;">
        <div class="container text-center">
            <h1>БЛОГ ТА <span>СТАТТІ</span></h1>
            <p class="mx-auto">Корисні поради від професіоналів автомийок та детейлінгу для догляду за вашим авто.</p>
        </div>
    </header>

    <!-- Blog List Section -->
    <section class="section-padding pt-4">
        <div class="container">
            <div class="row g-4" id="blog-container">
                <!-- Dynamic articles loaded from localStorage -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash. Всі права захищені.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function getDefaultStaticArticles() {
            return [
                {
                    title: 'Як правильно мити авто взимку на самообслуговуванні',
                    date: '10 Серпня, 2026',
                    image: 'https://images.unsplash.com/photo-1601362840469-51e4d8d58785?auto=format&fit=crop&q=80&w=600',
                    content: 'Головні правила безпечного миття кузова у морози: використання теплої води, обдув замків та сушка осмосом. На самообслуговуванні важливо дотримуватись температурного режиму та ретельно просушувати гумки дверей.'
                },
                {
                    title: 'Що таке осмос і чому після нього немає розводів?',
                    date: '5 Серпня, 2026',
                    image: 'https://images.unsplash.com/photo-1520340356584-f9917d1eea6f?auto=format&fit=crop&q=80&w=600',
                    content: 'Демінералізована вода (осмос) проходить через складні фільтри, видаляючи всі мінерали та солі. Завдяки цьому під час висихання крапель на кузові не залишається білих розводів.'
                },
                {
                    title: 'Відкриття нового комплексу STATUS у Києві',
                    date: '1 Серпня, 2026',
                    image: 'https://images.unsplash.com/photo-1507764923504-cd90bf7da772?auto=format&fit=crop&q=80&w=600',
                    content: 'Збільшуємо кількість постів та покращуємо сервіс для наших клієнтів на нових локаціях. Запрошуємо всіх автомобілістів на нові точки мережі STATUS.'
                }
            ];
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('blog-container');
            let articles = JSON.parse(localStorage.getItem('status_blog_articles'));
            
            if (!articles) {
                articles = getDefaultStaticArticles();
                localStorage.setItem('status_blog_articles', JSON.stringify(articles));
            }

            container.innerHTML = '';
            articles.forEach((art, index) => {
                const col = document.createElement('div');
                col.className = 'col-md-4';
                col.innerHTML = `
                    <div class="feature-card h-100 d-flex flex-column justify-content-between border-secondary">
                        <div>
                            ${art.image ? `<img src="${art.image}" alt="${art.title}" class="img-fluid rounded mb-3" style="height: 180px; width: 100%; object-fit: cover;">` : ''}
                            <span class="badge bg-primary mb-2">Блог</span>
                            <h3>${art.title}</h3>
                            <p class="text-muted small mb-2"><i class="fa-solid fa-calendar-days me-1"></i> ${art.date}</p>
                            <p class="small text-muted mb-4">${art.content.substring(0, 80)}...</p>
                        </div>
                        <a href="article.html?id=${index}" class="btn btn-outline-custom w-100 btn-sm">Читати статтю</a>
                    </div>
                `;
                container.appendChild(col);
            });
        });
    </script>
</body>
</html>
