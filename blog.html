<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог та Новини — STATUS Car Wash</title>
    <meta name="description" content="Корисні поради по догляду за автомобілем, новини мережі автомийок самообслуговування STATUS та рекомендації від експертів детейлінгу.">
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Marked.js for parsing Markdown files -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Frontmatter parser -->
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>CAR WASH</span>
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center gap-lg-4 mb-3 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="locations.html">Локації</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Ціни та Послуги</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Про нас & Детейлінг</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blog.html">Блог</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="hero" style="padding: 140px 0 60px;">
        <div class="container text-center">
            <h1>БЛОГ ТА <span>СТАТТІ</span></h1>
            <p class="mx-auto">Корисні поради від професіоналів автомийок та детейлінгу для догляду за вашим авто.</p>
        </div>
    </header>

    <!-- Blog List Section -->
    <section class="section-padding pt-4">
        <div class="container">
            <div class="row g-4" id="blog-container">
                <div class="col-12 text-center text-muted">Завантаження статей...</div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash. Всі права захищені.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // List of Markdown blog files managed by Decap CMS
        const blogFiles = [
            'content/blog/yak-pravylno-myty-avto-vzymku.md',
            'content/blog/scho-take-osmos.md',
            'content/blog/vidkryttya-novogo-kompleksu.md'
        ];

        async function loadBlogArticles() {
            const container = document.getElementById('blog-container');
            container.innerHTML = '';

            for (let i = 0; i < blogFiles.length; i++) {
                try {
                    const response = await fetch(blogFiles[i]);
                    if (!response.ok) continue;
                    const text = await response.text();

                    // Parse frontmatter and body
                    const parts = text.split('---');
                    if (parts.length >= 3) {
                        const frontmatter = jsyaml.load(parts[1]);
                        const body = parts.slice(2).join('---').trim();
                        const snippet = body.replace(/[#*`_]/g, '').substring(0, 90);

                        const col = document.createElement('div');
                        col.className = 'col-md-4';
                        col.innerHTML = `
                            <div class="feature-card h-100 d-flex flex-column justify-content-between border-secondary">
                                <div>
                                    ${frontmatter.image ? `<img src="${frontmatter.image}" alt="${frontmatter.title}" class="img-fluid rounded mb-3" style="height: 180px; width: 100%; object-fit: cover;">` : ''}
                                    <span class="badge bg-primary mb-2">Блог</span>
                                    <h3>${frontmatter.title}</h3>
                                    <p class="text-muted small mb-2"><i class="fa-solid fa-calendar-days me-1"></i> ${frontmatter.date || ''}</p>
                                    <p class="small text-muted mb-4">${snippet}...</p>
                                </div>
                                <a href="article.html?file=${encodeURIComponent(blogFiles[i])}" class="btn btn-outline-custom w-100 btn-sm">Читати статтю</a>
                            </div>
                        `;
                        container.appendChild(col);
                    }
                } catch (err) {
                    console.error('Error loading article:', blogFiles[i], err);
                }
            }

            if (container.children.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted">Поки що немає опублікованих статей.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogArticles);
    </script>
</body>
</html>
