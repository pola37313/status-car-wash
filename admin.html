<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адмін-панель блогу — STATUS Car Wash</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>ADMIN PANEL</span>
            </a>
            <div class="ms-auto">
                <a href="blog.html" class="btn btn-outline-custom btn-sm">Перейти до блогові</a>
            </div>
        </div>
    </nav>

    <!-- Admin Content -->
    <section class="section-padding" style="padding-top: 140px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="feature-card">
                        <h2 class="text-white mb-4"><i class="fa-solid fa-pen-to-square text-primary me-2"></i> Додати нову статтю / новину</h2>
                        <form id="article-form">
                            <div class="mb-3">
                                <label class="form-label text-white">Заголовок статті</label>
                                <input type="text" id="art-title" class="form-control bg-dark text-white border-secondary" required placeholder="Наприклад: Нові знижки на мийці...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Дата</label>
                                <input type="text" id="art-date" class="form-control bg-dark text-white border-secondary" value="10 Серпня, 2026" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Текст статті / Новини</label>
                                <textarea id="art-content" rows="5" class="form-control bg-dark text-white border-secondary" required placeholder="Введіть повний текст новини..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-custom w-100">Опублікувати статтю</button>
                        </form>
                        <div id="success-msg" class="alert alert-success mt-3 d-none">Статтю успішно опубліковано у блозі!</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash Admin.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('article-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('art-title').value;
            const date = document.getElementById('art-date').value;
            const content = document.getElementById('art-content').value;

            const newArticle = { title, date, content };
            const articles = JSON.parse(localStorage.getItem('status_blog_articles')) || [];
            articles.push(newArticle);
            localStorage.setItem('status_blog_articles', JSON.stringify(articles));

            document.getElementById('success-msg').classList.remove('d-none');
            setTimeout(() => {
                window.location.href = 'blog.html';
            }, 1500);
        });
    </script>
</body>
</html>
