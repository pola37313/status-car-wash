<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стаття — STATUS Car Wash</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Marked.js for rendering markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>CAR WASH</span>
            </a>
            <div class="ms-auto">
                <a href="blog.html" class="btn btn-outline-custom btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Назад до блогу</a>
            </div>
        </div>
    </nav>

    <!-- Article Detail Section -->
    <section class="section-padding" style="padding-top: 160px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8" id="article-content-container">
                    <div class="text-center text-muted">Завантаження статті...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash. Всі права захищені.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const filePath = urlParams.get('file');
            const container = document.getElementById('article-content-container');

            if (!filePath) {
                container.innerHTML = '<h3 class="text-white text-center">Статтю не знайдено</h3>';
                return;
            }

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();

                const parts = text.split('---');
                if (parts.length >= 3) {
                    const frontmatter = jsyaml.load(parts[1]);
                    const body = parts.slice(2).join('---').trim();
                    const htmlBody = marked.parse(body);

                    document.title = `${frontmatter.title} — STATUS Car Wash`;
                    container.innerHTML = `
                        <div class="feature-card border-secondary p-4 p-md-5">
                            <span class="badge bg-primary mb-3">Блог</span>
                            <h1 class="text-white font-chakra mb-3" style="font-size: 2.2rem; line-height: 1.3;">${frontmatter.title}</h1>
                            <p class="text-muted mb-4"><i class="fa-solid fa-calendar-days me-1"></i> ${frontmatter.date || ''}</p>
                            ${frontmatter.image ? `<img src="${frontmatter.image}" alt="${frontmatter.title}" class="img-fluid rounded mb-4 w-100" style="max-height: 450px; object-fit: cover;">` : ''}
                            <div class="article-text text-muted" style="font-size: 1.1rem; line-height: 1.9;">
                                ${htmlBody}
                            </div>
                            <div class="mt-5 pt-3 border-top border-secondary">
                                <a href="blog.html" class="btn btn-outline-custom btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Повернутися до всіх статей</a>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error('Invalid format');
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<h3 class="text-white text-center">Помилка завантаження статті</h3>';
            }
        });
    </script>
</body>
</html>
