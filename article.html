<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стаття — STATUS Car Wash</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800;900&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-car-rear" style="color: var(--primary-color);"></i>
                STATUS <span>CAR WASH</span>
            </a>
            <div class="ms-auto">
                <a href="blog.html" class="btn btn-outline-custom btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Назад до блогу</a>
            </div>
        </div>
    </nav>

    <!-- Article Detail Section -->
    <section class="section-padding" style="padding-top: 160px;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8" id="article-content-container">
                    <div class="text-center text-muted">Завантаження статті...</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="small text-muted mb-0">&copy; 2026 STATUS Car Wash. Всі права захищені.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1wg4tp4uShhYWfO8SEjeHlH32z0hAh5cgK3fW8bUg9EM/export?format=csv';

        function parseCSV(text) {
            let lines = [];
            let row = [''];
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let nextC = text[i+1];
                
                if (c === '"' && inQuotes && nextC === '"') {
                    row[row.length - 1] += '"';
                    i++;
                } else if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' && nextC === '\n') || (c === '\n' && !inQuotes)) {
                    if (c === '\r') i++;
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                lines.push(row);
            }
            return lines;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = parseInt(urlParams.get('id'));
            const container = document.getElementById('article-content-container');

            if (isNaN(postId)) {
                container.innerHTML = '<h3 class="text-white text-center">Статтю не знайдено</h3>';
                return;
            }

            try {
                let posts = JSON.parse(sessionStorage.getItem('status_sheet_posts'));
                if (!posts) {
                    const response = await fetch(SHEET_CSV_URL);
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);
                    posts = rows.slice(1).filter(r => r.length >= 4 && r[1] && r[1].trim() !== '');
                }

                const post = posts[postId];
                if (post) {
                    const date = post[0] || '';
                    const title = post[1] || '';
                    const image = post[2] || '';
                    const content = post[3] || '';

                    document.title = `${title} — STATUS Car Wash`;
                    container.innerHTML = `
                        <div class="feature-card border-secondary p-4 p-md-5">
                            <span class="badge bg-primary mb-3">Блог</span>
                            <h1 class="text-white font-chakra mb-3" style="font-size: 2.2rem; line-height: 1.3;">${title}</h1>
                            <p class="text-muted mb-4"><i class="fa-solid fa-calendar-days me-1"></i> ${date}</p>
                            ${image ? `<img src="${image}" alt="${title}" class="img-fluid rounded mb-4 w-100" style="max-height: 450px; object-fit: cover;">` : ''}
                            <div class="article-text text-muted" style="font-size: 1.1rem; line-height: 1.9; white-space: pre-line;">
                                ${content}
                            </div>
                            <div class="mt-5 pt-3 border-top border-secondary">
                                <a href="blog.html" class="btn btn-outline-custom btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Повернутися до всіх статей</a>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<h3 class="text-white text-center">Статтю не знайдено</h3>';
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<h3 class="text-white text-center">Помилка завантаження статті</h3>';
            }
        });
    </script>
</body>
</html>
